<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pronos Arena – Tous les matchs</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="w" id="vue"></main>
<nav class="bas" aria-label="Navigation principale"><div id="nb"></div></nav>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
<script>
nav("index");
var q="";
// Recherche sans tenir compte des accents ni des majuscules.
function norm(t){return String(t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()}
function liste(){
 var tous=avant(),mots=norm(q).split(/\s+/).filter(Boolean);
 var l=tous.filter(function(m){var c=norm(m.a+" "+m.b+" "+m.l);return mots.every(function(w){return c.indexOf(w)>-1})});
 if(!tous.length)return '<p class="vide" style="padding:24px 0">Aucun évènement pour le moment.</p>';
 if(!l.length)return '<p class="vide" style="padding:24px 0">Aucun match ne correspond à « '+esc(q.trim())+' ».</p>';
 var h='<p class="leg" style="margin:0 0 4px">'+l.length+(l.length>1?' matchs':' match')+'</p>',jour="";
 l.forEach(function(m){
  var j=new Date(m.start).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
  if(j!==jour){jour=j;h+='<h3 style="margin:16px 0 8px;font-size:15px;color:var(--mute);text-transform:capitalize">'+esc(j)+'</h3>'}
  h+='<div style="margin-bottom:10px">'+carte(m)+'</div>'});
 return h}
function rendre(){
 $("vue").innerHTML='<a href="index.html" class="tout" style="text-decoration:none;color:inherit;display:inline-block;margin-top:12px">← Accueil</a>'+
  '<div class="sec"><h2>Tous les <span class="b">matchs</span></h2></div>'+
  '<input class="in" id="rq" type="search" placeholder="Rechercher une équipe ou un championnat" autocomplete="off" value="'+esc(q)+'">'+
  '<div id="lst">'+liste()+'</div>';
 tic()}
$("vue").oninput=function(ev){if(ev.target.id==="rq"){q=ev.target.value;$("lst").innerHTML=liste();tic()}};
rendre();
</script>
</body>
</html>
