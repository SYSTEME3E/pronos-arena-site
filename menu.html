 '<button class="dir" data-thm style="width:100%;text-align:left"><span class="lg" style="background:var(--bg3);color:var(--txt);width:44px;height:44px"><span class="ti">'+iconeTheme()+'</span></span><span class="nom tl">'+(theme()==="dark"?"Passer en mode clair":"Passer en mode sombre")+'</span></button>'+
