<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pronos Arena – Statistiques</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="w" id="top"></div>
<main class="w" id="vue"></main>
<nav class="bas" aria-label="Navigation principale"><div id="nb"></div></nav>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
<script>
nav("index");
// Uniquement des données réelles : aucune statistique n'est inventée.
var SID=+((location.search.match(/id=(\d+)/)||[])[1])||0;
function statut(m){
 if(m.st==="annule")return '<b class="r">Annulé</b>';
 if(m.res)return '<b class="v">Terminé</b>';
 if(m.start>Date.now())return '<b class="j">À venir</b>';
 return '<b class="r">● En cours</b>'}
function rendre(){
 var m=find(SID);
 if(!m){$("vue").innerHTML='<a href="matchs.html" class="tout" style="text-decoration:none;color:inherit;display:inline-block;margin-top:12px">← Matchs</a><p class="vide">'+(_snap?"Ce match n’est plus disponible.":"Chargement…")+'</p>';return}
 var d=new Date(m.start).toLocaleString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric",hour:"2-digit",minute:"2-digit"});
 var centre=m.res?'<div class="j" style="font-size:30px;font-weight:800">'+esc(m.res.replace("-"," : "))+'</div>':'<div class="j" style="font-size:26px;font-weight:800">VS</div>';
 $("vue").innerHTML=
  '<div class="ban"><div style="display:flex;align-items:center;gap:10px"><a href="match.html?id='+m.id+'" class="tout" style="text-decoration:none;color:inherit">←</a><b style="flex:1;text-align:center;font-size:18px">Statistiques</b></div>'+
  '<p class="cd" style="margin:8px 0 0">Football. '+esc(m.l)+'</p>'+
  '<div class="vs" style="margin:14px 0 4px"><div class="eq" style="flex-direction:column;text-align:center">'+lg(m.a,m.ca,m.la)+'<span>'+esc(m.a)+'</span></div>'+centre+
  '<div class="eq" style="flex-direction:column;text-align:center">'+lg(m.b,m.cb,m.lb)+'<span>'+esc(m.b)+'</span></div></div></div>'+
  '<div class="fiche" style="margin-top:12px"><b>Informations du match</b>'+
  '<div class="ligne"><span>Compétition</span><b>'+esc(m.l||"–")+'</b></div>'+
  '<div class="ligne"><span>Coup d’envoi</span><b style="text-transform:capitalize;text-align:right">'+esc(d)+'</b></div>'+
  '<div class="ligne"><span>Statut</span>'+statut(m)+'</div>'+
  (m.res?'<div class="ligne"><span>Score final</span><b class="j">'+esc(m.res.replace("-"," : "))+'</b></div>':'')+'</div>'+
  '<p class="leg" style="color:var(--mute);font-size:13px">Les statistiques détaillées (possession, tirs, corners…) ne sont pas encore disponibles. Le score s’affiche ici une fois le match terminé.</p>';
 tic()}
rendre();
</script>
</body>
</html>
